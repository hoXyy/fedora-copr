name: Update RPM specs

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rpm-specs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update configured packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-specs.py

      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Validate all specs
        run: |
          find . -type f -name '*.spec' -print0 \
            | sort -z \
            | xargs -0 -r -n1 rpmspec -P >/dev/null
          git diff --check

      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "All configured specs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.spec'
          git commit -m "Update RPM specs"
          git push

